<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>薬剤師の症例トレーニング</title>
<style>
:root{--teal:#0f766e;--pale:#e3f5f1;--ink:#1c2b2d;--muted:#607477;--bg:#f3f8f6;--line:#d8e5e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
header{background:white;border-bottom:1px solid var(--line);padding:18px 16px;position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0;color:var(--teal)}header p{margin:3px 0 0;font-size:12px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:16px 14px 44px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:19px;margin:0 0 16px;box-shadow:0 3px 14px #1231}
h2{font-size:20px;line-height:1.45;margin:8px 0 10px}h3{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}.badge{display:inline-block;background:var(--pale);color:#075e57;border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px}
select,button,input,textarea{font:inherit}select{width:100%;padding:12px;border:1px solid #b8ccc6;border-radius:12px;background:white;margin-top:6px}
.rx{border:1px solid #cbd7d2;border-radius:12px;padding:14px;margin-top:12px;background:#fffefa}.rxhead{display:flex;justify-content:space-between;gap:8px;font-weight:700;border-bottom:1px solid #9caaa5;padding-bottom:8px}.patient{font-size:20px;font-weight:700;margin:5px 0}.rx table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.rx th,.rx td{text-align:left;padding:8px 4px;border-bottom:1px solid #e2e9e6;vertical-align:top}.rx th{color:#526562}
.grid{display:grid;grid-template-columns:1fr;gap:9px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer}.choice:has(input:checked){border:2px solid var(--teal);background:#effaf7}.choice input{margin-top:6px;transform:scale(1.15)}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}.primary{background:var(--teal);color:white}.secondary{background:#e7efec;color:#23413d}.row{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.row button{flex:1 1 140px}.feedback{margin-top:14px;border-radius:12px;padding:14px;background:#eef8f4;border:1px solid #c5e5d9}.feedback.error{background:#fff5e9;border-color:#f0d6ac}.feedback h3{margin-bottom:5px}.hidden{display:none!important}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #b8ccc6;border-radius:12px;margin-top:8px}ul{padding-left:22px}.small{font-size:13px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}.panel{padding:23px}}
</style>
</head>
<body>
<header><h1>薬剤師の症例トレーニング</h1><p>改良版・動作確認用プロトタイプ｜すべて架空の症例です</p></header>
<main>
<section class="panel">
<h3>学習モード</h3>
<label for="mode">練習したい内容を選んでね</label>
<select id="mode">
<option value="disease">疾患・処方意図を推測</option>
<option value="audit">処方監査・疑義照会</option>
<option value="integrated">総合実践（推測＋疑義照会）</option>
<option value="review">復習モード</option>
</select>
<p class="muted small">症例は1件ずつ進みます。選択式の回答と、自由記述の練習ができます。</p>
</section>
<div id="caseArea"></div>
<section class="panel" id="questionPanel">
<div class="badge" id="qnum">Q1</div>
<h2 id="question">この処方から考えられることは？</h2>
<p class="muted small" id="instruction">当てはまるものを選んでね（複数選択可）。</p>
<div id="choices" class="grid"></div>
<div id="freeArea" class="hidden"><label for="freeText"><strong>あなたならどう対応する？</strong></label><textarea id="freeText" placeholder="例：検査値と併用薬を確認し、処方医に疑義照会する…"></textarea></div>
<div class="row"><button class="primary" id="checkBtn">回答を確認する</button><button class="secondary" id="hintBtn">ヒントを見る</button><button class="secondary" id="nextBtn">次の症例 →</button></div>
<div id="hint" class="feedback hidden"></div><div id="result" class="feedback hidden" aria-live="polite"></div>
</section>
<section class="panel"><h3>このプロトタイプについて</h3><p class="small muted">学習目的の架空症例です。実際の患者の診療・調剤判断には使用せず、実務では最新の添付文書、院内手順、処方医への確認などを優先してください。</p><p class="small muted">回答はこのページ上で判定されます。入力内容は保存・送信されません。</p></section>
</main>
<script>
const cases = [
{dept:"総合内科・外来",title:"症例001：鎮痛薬が追加された患者",level:"中級",patient:"68歳・男性",facility:"さくら内科クリニック（架空）",date:"2026年10月25日",diagnosis:"膝関節痛。高血圧で通院中。",rx:[["アムロジピン錠 5 mg","1日1回 朝食後","28日分"],["ロキソプロフェン錠 60 mg","疼痛時 1回1錠","10回分"],["ファモチジン錠 20 mg","1日1回 夕食後","10日分"]],labs:[["Scr","1.3 mg/dL","男性 約0.65–1.07 mg/dL"],["eGFR","44 mL/min/1.73m²","60以上が目安"]],question:"この処方から考えられる注意点は？",choices:["NSAIDsによる腎機能悪化のリスクを確認する","ロキソプロフェンは腎機能に影響しないので確認不要","高血圧患者ではNSAIDsによる血圧上昇に注意する","胃薬が処方されているので副作用は完全に防げる"],correct:[0,2],hint:"腎機能、血圧、脱水の有無、鎮痛薬の使用頻度を確認して考えてみよう。",explain:"eGFR 44は腎機能低下がある範囲です。ロキソプロフェンなどのNSAIDsは腎機能悪化や血圧上昇、体液貯留につながる場合があります。処方意図・使用期間・患者背景を確認し、必要に応じて処方医や薬剤師間で相談します。ファモチジンがあってもすべてのリスクを防げるわけではありません。"},
{dept:"循環器・病棟",title:"症例002：高カリウム血症が疑われる患者",level:"上級",patient:"76歳・女性",facility:"みどり総合病院（架空）",date:"2026年10月25日",diagnosis:"心不全・高血圧。食欲低下あり。",rx:[["エナラプリル錠 5 mg","1日1回 朝食後","継続"],["スピロノラクトン錠 25 mg","1日1回 朝食後","継続"],["イブプロフェン錠 200 mg","疼痛時","新規"]],labs:[["K","5.5 mEq/L","3.5–5.0 mEq/L"],["eGFR","38 mL/min/1.73m²","60以上が目安"],["Scr","1.4 mg/dL","女性 約0.46–0.79 mg/dL"]],question:"優先して確認・対応すべき点は？",choices:["K 5.5と併用薬を踏まえ、高カリウム血症のリスクを速やかに確認する","ACE阻害薬＋スピロノラクトン＋NSAIDの併用背景を確認する","食欲低下があっても検査値は無視してよい","処方医へ状況を共有し、緊急性や再検査等を確認する"],correct:[0,1,3],hint:"Kの基準範囲と、腎機能・併用薬がカリウムに与える影響を整理しよう。",explain:"K 5.5 mEq/Lは基準範囲を超えています。ACE阻害薬とスピロノラクトンは高カリウム血症のリスクがあり、NSAIDや腎機能低下、食事・水分摂取の変化も含めて評価が必要です。処方医に速やかに連絡し、症状・心電図・再検査などの必要性を医療チームで判断します。実臨床では施設の緊急対応手順に従います。"},
{dept:"感染症・外来",title:"症例003：抗菌薬が処方された患者",level:"中級",patient:"34歳・男性",facility:"ひまわり耳鼻咽喉科（架空）",date:"2026年10月25日",diagnosis:"発熱・咽頭痛。処方箋に診断名の記載なし。",rx:[["アモキシシリンカプセル 250 mg","1回2カプセル 1日3回","5日分"],["アセトアミノフェン錠 500 mg","発熱・疼痛時 1回1錠","必要時"]],labs:[["体温","38.2 ℃","平熱の目安 約36–37 ℃"],["アレルギー歴","記載なし","抗菌薬のアレルギー歴を確認"]],question:"調剤前に確認したい項目は？",choices:["ペニシリン系抗菌薬のアレルギー歴を確認する","抗菌薬の適応・用法用量・服用期間を確認する","診断が不明でも何も確認せず調剤する","症状、受診経過、処方意図に疑問があれば処方元へ確認する"],correct:[0,1,3],hint:"安全性と適正使用の観点から、処方箋だけでは分からない情報を考えてみよう。",explain:"アモキシシリンはペニシリン系抗菌薬なので、アレルギー歴の確認が重要です。症状や診断、用法用量、服用期間が妥当かを確認し、不明点や疑問があれば処方元へ問い合わせます。抗菌薬は患者の状態や感染症の種類に応じた適正使用が必要です。"}
];
let index=0;
const $=id=>document.getElementById(id);
function render(){
 const c=cases[index];
 $("caseArea").innerHTML=`<section class="panel"><span class="badge">${c.dept}</span><h2>${c.title}</h2><p class="muted">難易度：${c.level}｜架空症例｜CASE ${String(index+1).padStart(2,"0")} / ${cases.length}</p><div class="rx"><div class="rxhead"><span>処方箋（学習用サンプル）</span><span>${c.date}</span></div><p class="muted">患者氏名</p><div class="patient">${c.patient}</div><p class="muted">医療機関：${c.facility}</p><p><strong>背景：</strong>${c.diagnosis}</p><table><thead><tr><th>薬品名・規格</th><th>用法・用量</th><th>日数</th></tr></thead><tbody>${c.rx.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table><h3 style="margin-top:16px">検査値・確認事項</h3><table><thead><tr><th>項目</th><th>患者値</th><th>基準範囲・目安</th></tr></thead><tbody>${c.labs.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="small muted">※氏名・医療機関・処方内容はすべて架空です。</p></div></section>`;
 $("qnum").textContent=`Q${index+1}`;
 $("question").textContent=c.question;
 $("choices").innerHTML=c.choices.map((v,i)=>`<label class="choice"><input type="checkbox" value="${i}"><span>${v}</span></label>`).join("");
 $("hint").classList.add("hidden");$("result").classList.add("hidden");$("freeText").value="";
 const mode=$("mode").value;
 $("freeArea").classList.toggle("hidden",mode==="disease"||mode==="review");
 $("instruction").textContent=mode==="audit"?"危険性や確認事項を選び、下欄に疑義照会・対応案を記入してね。":mode==="integrated"?"処方意図と安全性の両方から考え、必要なら対応案も記入してね。":"当てはまるものを選んでね（複数選択可）。";
 $("nextBtn").textContent=index===cases.length-1?"最初の症例へ ↺":"次の症例 →";
}
$("checkBtn").addEventListener("click",()=>{
 const c=cases[index], selected=[...document.querySelectorAll('#choices input:checked')].map(x=>Number(x.value));
 const correct=c.correct;
 const ok=selected.length===correct.length&&selected.every(x=>correct.includes(x));
 const free=$("freeText").value.trim();
 $("result").classList.remove("hidden");$("result").classList.toggle("error",!ok);
 $("result").innerHTML=`<h3>${ok?"選択回答：正解！":"選択回答を確認しよう"}</h3><p>${ok?"重要なポイントを押さえられています。":"正解は選択肢 "+correct.map(n=>n+1).join("・")+" です。解説を読んで、もう一度整理してみよう。"}</p><h3>解説</h3><p>${c.explain}</p>${$("mode").value!=="disease"&&$("mode").value!=="review"?`<h3>自由記述</h3><p>${free?`入力内容：${escapeHtml(free)}`:"自由記述は未入力です。必要なら、処方医への確認事項や対応案を書いてみよう。"}</p>`:""}`;
});
$("hintBtn").addEventListener("click",()=>{$("hint").textContent="ヒント："+cases[index].hint;$("hint").classList.remove("hidden")});
$("nextBtn").addEventListener("click",()=>{index=(index+1)%cases.length;render();window.scrollTo({top:0,behavior:"smooth"})});
$("mode").addEventListener("change",render);
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script>
</body></html>
