<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
header{background:white;border-bottom:1px solid var(--line);padding:18px 16px;position:sticky;top:0;z-index:3}
h1{font-size:20px;margin:0;color:var(--teal)}header p{margin:3px 0 0;font-size:12px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:16px 14px 44px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:19px;margin:0 0 16px;box-shadow:0 3px 14px #1231}
h2{font-size:20px;line-height:1.45;margin:8px 0 10px}h3{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}.badge{display:inline-block;background:var(--pale);color:#075e57;border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px}

<body>
<header><h1>薬剤師の症例トレーニング</h1><p>v4｜症例6件・対応例つき解説｜すべて架空の症例です</p></header>
<main>
<section class="panel">
<h3>学習モード</h3>
<label for="mode">練習したい内容を選んでね</label>
<select id="mode">
<option value="disease">疾患・処方意図を推測</option>
<option value="audit">処方監査・疑義照会</option>
<option value="integrated">総合実践（推測＋疑義照会）</option>
<option value="review">復習モード</option>
</select>
<p class="muted small">症例は1件ずつ進みます。選択式の回答と、自由記述の練習ができます。</p>
</section>
<div id="caseArea"></div>
<section class="panel" id="questionPanel">
<div class="badge" id="qnum">Q1</div>
<h2 id="question">この処方から考えられることは？</h2>
<p class="muted small" id="instruction">当てはまるものを選んでね（複数選択可）。</p>
<div id="choices" class="grid"></div>
<div id="freeArea" class="hidden"><label for="freeText"><strong>あなたならどう対応する？</strong></label><textarea id="freeText" placeholder="例：検査値と併用薬を確認し、処方医に疑義照会する…"></textarea></div>
<div class="row"><button class="primary" id="checkBtn">回答を確認する</button><button class="secondary" id="hintBtn">ヒントを見る</button><button class="secondary" id="nextBtn">次の症例 →</button></div>
<div id="hint" class="feedback hidden"></div><div id="result" class="feedback hidden" aria-live="polite"></div>
</section>
<section class="panel"><h3>このプロトタイプについて</h3><p class="small muted">学習目的の架空症例です。実際の患者の診療・調剤判断には使用せず、実務では最新の添付文書、院内手順、処方医への確認などを優先してください。</p><p class="small muted">回答はこのページ上で判定されます。入力内容は保存・送信されません。</p></section>
</main>

const cases = [
{dept:"総合内科・外来",title:"症例001：鎮痛薬が追加された患者",level:"中級",patient:"68歳・男性",facility:"さくら内科クリニック（架空）",date:"2026年10月25日",diagnosis:"膝関節痛。高血圧で通院中。",rx:[["アムロジピン錠 5 mg","1日1回 朝食後","28日分"],["ロキソプロフェン錠 60 mg","疼痛時 1回1錠","10回分"],["ファモチジン錠 20 mg","1日1回 夕食後","10日分"]],labs:[["Scr","1.3 mg/dL","男性 約0.65–1.07 mg/dL"],["eGFR","44 mL/min/1.73m²","60以上が目安"]],question:"この処方から考えられる注意点は？",choices:["NSAIDsによる腎機能悪化のリスクを確認する","ロキソプロフェンは腎機能に影響しないので確認不要","高血圧患者ではNSAIDsによる血圧上昇に注意する","胃薬が処方されているので副作用は完全に防げる"],correct:[0,2],hint:"腎機能、血圧、脱水の有無、鎮痛薬の使用頻度を確認して考えてみよう。",explain:"eGFR 44は腎機能低下がある範囲です。ロキソプロフェンなどのNSAIDsは腎機能悪化や血圧上昇、体液貯留につながる場合があります。処方意図・使用期間・患者背景を確認し、必要に応じて処方医や薬剤師間で相談します。ファモチジンがあってもすべてのリスクを防げるわけではありません。",action:"対応例：①鎮痛薬の使用頻度・期間、脱水症状、尿量、血圧を確認する。②腎機能低下があることを踏まえ、NSAID継続の必要性や代替策について処方医に相談する。③患者には自己判断で市販NSAIDを追加しないこと、体調変化があれば相談することを伝える。"},
{dept:"循環器・病棟",title:"症例002：高カリウム血症が疑われる患者",level:"上級",patient:"76歳・女性",facility:"みどり総合病院（架空）",date:"2026年10月25日",diagnosis:"心不全・高血圧。食欲低下あり。",rx:[["エナラプリル錠 5 mg","1日1回 朝食後","継続"],["スピロノラクトン錠 25 mg","1日1回 朝食後","継続"],["イブプロフェン錠 200 mg","疼痛時","新規"]],labs:[["K","5.5 mEq/L","3.5–5.0 mEq/L"],["eGFR","38 mL/min/1.73m²","60以上が目安"],["Scr","1.4 mg/dL","女性 約0.46–0.79 mg/dL"]],question:"優先して確認・対応すべき点は？",choices:["K 5.5と併用薬を踏まえ、高カリウム血症のリスクを速やかに確認する","ACE阻害薬＋スピロノラクトン＋NSAIDの併用背景を確認する","食欲低下があっても検査値は無視してよい","処方医へ状況を共有し、緊急性や再検査等を確認する"],correct:[0,1,3],hint:"Kの基準範囲と、腎機能・併用薬がカリウムに与える影響を整理しよう。",explain:"K 5.5 mEq/Lは基準範囲を超えています。ACE阻害薬とスピロノラクトンは高カリウム血症のリスクがあり、NSAIDや腎機能低下、食事・水分摂取の変化も含めて評価が必要です。処方医に速やかに連絡し、症状・心電図・再検査などの必要性を医療チームで判断します。実臨床では施設の緊急対応手順に従います。",action:"対応例：①検査値の採血時刻・溶血の可能性・症状を確認する。②K高値と腎機能、ACE阻害薬・スピロノラクトン・NSAIDの併用を処方医へ速やかに共有する。③再検査、心電図、薬剤調整などは医師の判断と施設手順に従う。動悸、筋力低下、失神などがあれば緊急性を優先する。"},
{dept:"感染症・外来",title:"症例003：抗菌薬が処方された患者",level:"中級",patient:"34歳・男性",facility:"ひまわり耳鼻咽喉科（架空）",date:"2026年10月25日",diagnosis:"発熱・咽頭痛。処方箋に診断名の記載なし。",rx:[["アモキシシリンカプセル 250 mg","1回2カプセル 1日3回","5日分"],["アセトアミノフェン錠 500 mg","発熱・疼痛時 1回1錠","必要時"]],labs:[["体温","38.2 ℃","平熱の目安 約36–37 ℃"],["アレルギー歴","記載なし","抗菌薬のアレルギー歴を確認"]],question:"調剤前に確認したい項目は？",choices:["ペニシリン系抗菌薬のアレルギー歴を確認する","抗菌薬の適応・用法用量・服用期間を確認する","診断が不明でも何も確認せず調剤する","症状、受診経過、処方意図に疑問があれば処方元へ確認する"],correct:[0,1,3],hint:"安全性と適正使用の観点から、処方箋だけでは分からない情報を考えてみよう。",explain:"アモキシシリンはペニシリン系抗菌薬なので、アレルギー歴の確認が重要です。症状や診断、用法用量、服用期間が妥当かを確認し、不明点や疑問があれば処方元へ問い合わせます。抗菌薬は患者の状態や感染症の種類に応じた適正使用が必要です。",action:"対応例：①ペニシリン系薬のアレルギー歴と過去の反応内容を確認する。②診断・処方量・回数・日数、腎機能や併用薬など必要情報を確認する。③不明点や用量への疑問があれば調剤前に処方元へ照会し、服用方法、飲み切りの指示、発疹・呼吸困難などの受診目安を説明する。"}
,{dept:"糖尿病・外来",title:"症例004：腎機能が低下した糖尿病患者",level:"上級",patient:"72歳・男性",facility:"あおぞら内科（架空）",date:"2026年10月25日",diagnosis:"2型糖尿病。食欲低下があり、数日間下痢が続いている。",rx:[["メトホルミン錠 500 mg","1回1錠 1日2回 食後","継続"],["シタグリプチン錠 50 mg","1日1回 朝食後","継続"]],labs:[["eGFR","28 mL/min/1.73m²","60以上が目安"],["血糖","142 mg/dL","状況・採血条件により評価"],["症状","下痢・食欲低下","脱水の有無を確認"]],question:"優先して確認したいことは？",choices:["eGFR 28と急性の体調不良を踏まえ、メトホルミンの継続可否を速やかに処方医へ確認する","下痢があっても脱水リスクは考えなくてよい","腎機能に応じた薬剤用量・使用可否の確認が必要","体調不良時の対応と受診目安を確認する"],correct:[0,2,3],hint:"腎機能の数値だけでなく、下痢による脱水など一時的な変化も考えよう。",explain:"eGFR 28 mL/min/1.73m²は高度の腎機能低下にあたります。メトホルミンは腎機能や急性疾患・脱水などの状況によって使用上の重要な注意が必要です。薬剤の継続・中止を薬剤師だけで決めず、処方医に速やかに情報共有して判断を確認します。シタグリプチンも腎機能に応じた用量確認が必要です。",action:"対応例：①下痢の期間、飲水量、尿量、発熱・嘔吐などを聞き取る。②eGFR 28と体調不良を処方医へ伝え、メトホルミンの使用可否と各薬剤の腎機能に応じた用量を確認する。③脱水が疑われる、飲食できない、尿量が著しく少ないなどの場合は速やかな医療評価につなぐ。患者へは体調不良時の連絡先・対応を具体的に案内する。"},
{dept:"糖尿病・病棟",title:"症例005：低血糖が疑われる患者",level:"中級",patient:"65歳・女性",facility:"みどり総合病院（架空）",date:"2026年10月25日",diagnosis:"2型糖尿病。朝食をほとんど食べられなかった。冷汗と手の震えがある。",rx:[["グリメピリド錠 1 mg","1日1回 朝食直前","継続"],["インスリン製剤","処方内容を別途確認","使用中"]],labs:[["血糖","58 mg/dL","低血糖を疑う値（一般に70 mg/dL未満）"],["食事摂取","朝食ほぼ摂取できず","摂取状況を確認"]],question:"まず優先すべき対応は？",choices:["低血糖の可能性を優先して評価し、意識・嚥下状態と血糖を確認する","食事を食べていない場合でも薬の影響は考えなくてよい","医療機関の低血糖対応手順に沿って速やかに対応する","食事量、腎機能、糖尿病薬の使い方を確認し、再発予防を検討する"],correct:[0,2,3],hint:"数値だけでなく、冷汗・震え・食事摂取・使用中の薬を合わせて考えよう。",explain:"血糖58 mg/dLに冷汗・振戦があり、低血糖が疑われます。意識状態と安全に飲み込めるかをまず確認し、施設の低血糖対応手順に従って対応します。意識障害や嚥下困難がある人に無理に飲食させてはいけません。スルホニル尿素薬やインスリンは低血糖に関係するため、食事量や投与状況、腎機能なども確認します。",action:"対応例：①意識・嚥下状態を確認し、ただちに院内の低血糖対応手順を開始する。②意識障害・けいれん・嚥下困難があれば経口摂取させず、緊急対応を要請する。③改善後も再低下に注意し、食事摂取、インスリン投与、グリメピリドの服用状況を医療チームで確認する。患者には食事が取れない時の薬の扱いを、自己判断に任せず医療者へ相談するよう説明する。"},
{dept:"循環器・外来",title:"症例006：抗凝固薬使用中の患者",level:"上級",patient:"79歳・男性",facility:"さくら循環器クリニック（架空）",date:"2026年10月25日",diagnosis:"心房細動で抗凝固療法中。腰痛のため市販鎮痛薬を追加したいと相談。",rx:[["アピキサバン錠 5 mg","1日2回","継続"],["市販イブプロフェン","本人が追加を検討","未使用"]],labs:[["Hb","確認できていない","出血症状・検査情報を確認"],["症状","黒色便・血尿などの有無は未確認","出血兆候を確認"]],question:"薬剤師として適切な対応は？",choices:["抗凝固薬とNSAIDの併用による出血リスクを説明し、使用前に医療者へ相談するよう伝える","市販薬なので相互作用の確認は不要と伝える","出血兆候や他の併用薬を確認する","痛みの程度や原因、代替となる対応を医師・薬剤師と検討する"],correct:[0,2,3],hint:"処方薬だけでなく、市販薬・サプリメントも含めて確認することが大切。",explain:"アピキサバンなどの抗凝固薬を使用している患者では、NSAIDの併用により出血リスクが高まる可能性があります。市販薬も薬物療法全体の一部として確認します。すでに出血が疑われる症状がある場合は、自己判断で様子を見ず、速やかな医療評価が必要です。",action:"対応例：①黒色便、血尿、吐血、止まりにくい出血、強い頭痛などの有無を確認する。②アピキサバン使用中であることを踏まえ、イブプロフェンを自己判断で追加しないよう伝える。③痛みの原因・程度、他の薬やサプリメントを確認し、適切な鎮痛方法を処方医・薬剤師と検討する。出血を疑う症状があれば速やかな受診につなぐ。"}

let index=0;
const $=id=>document.getElementById(id);
function render(){
 const c=cases[index];
 $("caseArea").innerHTML=`<section class="panel"><span class="badge">${c.dept}</span><h2>${c.title}</h2><p class="muted">難易度：${c.level}｜架空症例｜CASE ${String(index+1).padStart(2,"0")} / ${cases.length}</p><div class="rx"><div class="rxhead"><span>処方箋（学習用サンプル）</span><span>${c.date}</span></div><p class="muted">患者氏名</p><div class="patient">${c.patient}</div><p class="muted">医療機関：${c.facility}</p><p><strong>背景：</strong>${c.diagnosis}</p><table><thead><tr><th>薬品名・規格</th><th>用法・用量</th><th>日数</th></tr></thead><tbody>${c.rx.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table><h3 style="margin-top:16px">検査値・確認事項</h3><table><thead><tr><th>項目</th><th>患者値</th></tr></thead><tbody>${c.labs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table><p class="small muted">※氏名・医療機関・処方内容はすべて架空です。</p></div></section>`;
 $("qnum").textContent=`Q${index+1}`;
 $("question").textContent=c.question;
 $("choices").innerHTML=c.choices.map((v,i)=>`<label class="choice"><input type="checkbox" value="${i}"><span>${v}</span></label>`).join("");
 $("hint").classList.add("hidden");$("result").classList.add("hidden");$("freeText").value="";
 const mode=$("mode").value;
 $("freeArea").classList.toggle("hidden",mode==="disease"||mode==="review");
 $("instruction").textContent=mode==="audit"?"危険性や確認事項を選び、下欄に疑義照会・対応案を記入してね。":mode==="integrated"?"処方意図と安全性の両方から考え、必要なら対応案も記入してね。":"当てはまるものを選んでね（複数選択可）。";
 $("nextBtn").textContent=index===cases.length-1?"最初の症例へ ↺":"次の症例 →";
}
$("checkBtn").addEventListener("click",()=>{
 const c=cases[index], selected=[...document.querySelectorAll('#choices input:checked')].map(x=>Number(x.value));
 const correct=c.correct;
 const ok=selected.length===correct.length&&selected.every(x=>correct.includes(x));
